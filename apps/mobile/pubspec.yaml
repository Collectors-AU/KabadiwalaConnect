name: kabadiwala_connect
description: An e-waste collector management platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  flutter_tts: ^3.8.3
  provider: ^6.1.1
  speech_to_text: ^7.4.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  tflite_flutter: ^0.12.1
  connectivity_plus: ^5.0.1
  crypto: ^3.0.3
  image: ^4.1.7
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/icons/
    - assets/images/
    - assets/audio/
